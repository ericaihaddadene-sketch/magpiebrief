name: Build and deploy

on:
  # Rebuild hourly. GitHub's scheduler is best-effort and can run late under
  # load; if you need reliable timing, trigger from an external cron instead.
  schedule:
    - cron: '7 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default. Only the archive job needs write, and it asks for it
# itself — a push-triggered run has no ability to commit anything.
permissions:
  contents: read

# Never let two builds deploy at once, but don't cancel a run mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # The archive lives on its own branch, checked out into archive/ so the
      # build reads and writes it exactly as it does locally. Keeping it off
      # main is what stops CI ever committing to the branch people work on.
      - name: Check out archive data
        uses: actions/checkout@v4
        with:
          ref: archive-data
          path: archive

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Persist the conditional-GET cache between runs so publishers get 304s
      # instead of full downloads every hour. Restore-keys make a near-miss
      # still usable rather than starting cold.
      - name: Restore feed cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: feed-cache-${{ github.run_id }}
          restore-keys: |
            feed-cache-

      - name: Run tests
        run: npm test

      # Fails the run on a policy violation, so deploy never happens.
      - name: Build site
        run: npm run build

      # Handed to the archive job rather than committed here, so that a push
      # never causes a commit. See that job for why.
      - name: Hand archive to the persist job
        uses: actions/upload-artifact@v4
        with:
          name: archive
          path: archive/
          retention-days: 1
          if-no-files-found: ignore

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Committing the archive is deliberately separate, and deliberately only runs
  # on the schedule.
  #
  # When this lived in the build job it ran on every trigger — including push —
  # so pushing to main caused CI to commit seconds later and leave the local
  # branch behind immediately. Every single push needed a rebase. Now a push
  # only ever builds and deploys, and the archive is written once an hour by a
  # job nobody is racing.
  #
  # It reuses the build's output instead of rebuilding, so the committed archive
  # is exactly what was deployed, and the feeds are not fetched twice.
  archive:
    needs: build
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only the data branch is checked out — this job never touches main, and
      # so cannot put your working branch behind.
      - uses: actions/checkout@v4
        with:
          ref: archive-data

      - name: Collect archive from the build
        uses: actions/download-artifact@v4
        with:
          name: archive
          path: .

      - name: Commit archive
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "archive unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # No [skip ci] needed now: this branch triggers no workflow, since
          # the build only runs on pushes to main.
          git commit -m "Update archive"
          # Two scheduled runs could still overlap under a late scheduler.
          for attempt in 1 2 3; do
            if git push origin HEAD:archive-data; then
              echo "archive pushed"
              exit 0
            fi
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase --autostash origin archive-data || true
          done
          echo "::warning::could not push archive after 3 attempts; it will be retried next hour"
