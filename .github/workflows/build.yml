name: Build and deploy

on:
  # Rebuild hourly. GitHub's scheduler is best-effort and can run late under
  # load; if you need reliable timing, trigger from an external cron instead.
  schedule:
    - cron: '7 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # write, not read: the archive is committed back to the repo after each build.
  # CI checks out fresh every run, so anything not committed is lost.
  contents: write
  pages: write
  id-token: write

# Never let two builds deploy at once, but don't cancel a run mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Persist the conditional-GET cache between runs so publishers get 304s
      # instead of full downloads every hour. Restore-keys make a near-miss
      # still usable rather than starting cold.
      - name: Restore feed cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: feed-cache-${{ github.run_id }}
          restore-keys: |
            feed-cache-

      - name: Run tests
        run: npm test

      - name: Build site
        run: npm run build

      # The archive is the only state that has to outlive the run. Committed
      # with [skip ci] so it does not trigger another build and loop forever.
      - name: Persist archive
        run: |
          if [ -z "$(git status --porcelain archive)" ]; then
            echo "archive unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive
          git commit -m "Update archive [skip ci]"
          # A scheduled run and a push can overlap; rebase onto whatever landed
          # first rather than failing the build over it.
          for attempt in 1 2 3; do
            if git push; then
              echo "archive pushed"
              exit 0
            fi
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase --autostash origin main || true
          done
          echo "::warning::could not push archive after 3 attempts; it will be retried next run"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
