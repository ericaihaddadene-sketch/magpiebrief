<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Browser tab strips go dark in dark mode, where a navy bird on transparent
       disappears entirely. SVG favicons honour prefers-color-scheme, so the mark
       flips to light ink instead of vanishing. -->
  <style>
    path { fill: #14243d; }
    @media (prefers-color-scheme: dark) { path { fill: #e9eff5; } }
  </style>
